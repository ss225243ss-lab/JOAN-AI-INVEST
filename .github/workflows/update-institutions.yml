name: Update TWSE institutional net flows
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_institutions.py'
      - '.github/workflows/update-institutions.yml'
  schedule:
    - cron: '35 12 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_institutions.py
      - name: Publish official results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/institutions.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official TWSE institutional flows"
            git pull --rebase
            git push
          fi
