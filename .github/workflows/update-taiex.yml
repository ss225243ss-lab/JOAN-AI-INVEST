name: Update official TAIEX history
on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_taiex.py
      - name: Commit official data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/taiex.json
          if ! git diff --cached --quiet; then
            git commit -m "Update TWSE official TAIEX history"
            git push
          fi
