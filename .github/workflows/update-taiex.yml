name: Update official TAIEX OHLCV
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_taiex.py'
      - '.github/workflows/update-taiex.yml'
  schedule:
    - cron: '45 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: official-taiex
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate TAIEX OHLCV history
        run: python scripts/update_taiex.py
      - name: Publish verified official history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_taiex.py
            git add data/taiex.json
            if git diff --cached --quiet; then
              echo "No new verified TAIEX data to publish"
              break
            fi
            git commit -m "Update verified TWSE TAIEX OHLCV"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
