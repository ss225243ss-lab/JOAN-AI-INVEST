name: Update official TWSE margin statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * 1-5'
permissions:
  contents: write
concurrency:
  group: official-twse-margin
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official margin summary
        run: python scripts/update_margin.py
      - name: Commit validated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/margin.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official TWSE margin balance history"
            git pull --rebase
            git push
          fi
